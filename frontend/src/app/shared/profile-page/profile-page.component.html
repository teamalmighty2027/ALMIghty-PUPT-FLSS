<div class="profile-page-container" @pageFloatUpAnimation>
  <div class="page-header">
    <h1>My Profile</h1>
    <p>View and update your personal and account information</p>
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form-card">
    <div class="split-layout">
      
      <div class="left-section">
        <div class="avatar-container">
          <div class="profile-avatar">
            <!-- Show Image if it exists, else show the default icon -->
            <img *ngIf="profilePictureUrl" [src]="profilePictureUrl" alt="Profile Picture" class="avatar-img">
            <span *ngIf="!profilePictureUrl" mat-symbol>person</span>
          </div>

          <!-- Hidden file input -->
          <input type="file" #fileInput hidden (change)="onFileSelected($event)" accept="image/*">
          
          <!-- Trigger button -->
          <button 
            type="button"
            class="maroon-btn"
            style="margin-top: 10px;"
            (click)="fileInput.click()">
            Change Profile Picture
          </button>
        </div>

        <div style="width: 100%">
          <div class="form-control-group">
            <label>First Name</label>
            <input formControlName="first_name" class="pill-input" placeholder="Enter first name">
            <span class="error-text" *ngIf="profileForm.get('first_name')?.invalid && profileForm.get('first_name')?.touched">
              First name is required.
            </span>
          </div>
          <div class="form-control-group">
            <label>Last Name</label>
            <input formControlName="last_name" class="pill-input" placeholder="Enter last name">
            <span class="error-text" *ngIf="profileForm.get('last_name')?.invalid && profileForm.get('last_name')?.touched">
              Last name is required.
            </span>
          </div>
        </div>
      </div>

      <div class="v-divider"></div>

      <div class="right-section">
        <div class="compact-row">
          <div class="field-group faculty-code">
            <label>Faculty Code</label>
            <!-- Add readonly attribute -->
            <input formControlName="code" class="pill-input" placeholder="e.g., 1234" readonly>
          </div>
          <div class="field-group department">
            <label>Department</label>
            <input formControlName="department" class="pill-input" placeholder="e.g., IT Dept" 
                  [title]="profileForm.get('department')?.value || ''">
          </div>
        </div>

        <div class="compact-row">
          <div class="field-group birthdate">
            <label>Birthdate</label>
            <input type="date" formControlName="birthdate" class="pill-input">
          </div>
          <div class="field-group sex">
            <label>Sex</label>
            <select formControlName="sex" class="pill-input">
              <option [value]="''" disabled selected>Select option...</option> 
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>
        </div>
      </div>
    </div> 
    
    <h3 class="address-section-header">Address Details</h3>
    
    <div class="address-grid">
      <div class="field-group">
        <input formControlName="house_num" placeholder="House / Unit #" class="pill-input"
              [title]="profileForm.get('house_num')?.value || ''">
      </div>
      <div class="field-group">
        <input formControlName="street" placeholder="Street / Subdivision" class="pill-input"
              [title]="profileForm.get('street')?.value || ''">
      </div>

      <!-- Province Dropdown -->
      <div class="field-group">
        <select formControlName="province" class="pill-input">
          <!-- Note the brackets around [value]="''" -->
          <option [value]="''" disabled selected>Select Province...</option>
          <option *ngFor="let prov of provinces" [value]="prov.name">
            {{ prov.name }}
          </option>
        </select>
      </div>

      <!-- City Dropdown -->
      <div class="field-group">
        <select formControlName="city" class="pill-input">
          <option [value]="''" disabled selected>Select City/Municipality...</option>
          <option *ngFor="let city of cities" [value]="city.name">
            {{ city.name }}
          </option>
        </select>
      </div>

      <!-- Barangay Dropdown -->
      <div class="field-group">
        <select formControlName="barangay" class="pill-input">
          <option [value]="''" disabled selected>Select Barangay...</option>
          <option *ngFor="let brgy of barangays" [value]="brgy.name">
            {{ brgy.name }}
          </option>
        </select>
      </div>

      <div class="field-group">
        <input formControlName="zipcode" placeholder="Zipcode" class="pill-input" maxlength="4">
        <span class="error-text" *ngIf="profileForm.get('zipcode')?.invalid && profileForm.get('zipcode')?.touched">
          Must be a 4-digit number.
        </span>
      </div>
    </div>

    <div class="action-row">
        <button type="button" class="outline-btn">Change Password</button>
        <button type="submit" 
               class="maroon-btn" 
               [disabled]="profileForm.invalid || isLoading"
               [class.force-disabled]="profileForm.invalid || isLoading">
        {{ isLoading ? 'Saving...' : 'Save Changes' }}
        </button>
    </div>
  </form>
</div>
