<div class="profile-page-container" @pageFloatUpAnimation>
  <div class="page-header">
    <h1>My Profile</h1>
    <p>View and update your personal and account information</p>
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form-card">
    <div class="split-layout">
      
      <div class="left-section">
        <div class="avatar-container">
          <div class="profile-avatar">
            <span mat-symbol>person</span>
          </div>
          <button 
            type="button"
            mat-flat-button 
            class="preferences-btn">
            Update Photo
          </button>
        </div>

        <div style="width: 100%">
          <div class="form-control-group">
            <label>First Name</label>
            <input formControlName="first_name" class="pill-input" placeholder="Enter first name">
            <span class="error-text" *ngIf="profileForm.get('first_name')?.invalid && profileForm.get('first_name')?.touched">
              First name is required.
            </span>
          </div>
          <div class="form-control-group">
            <label>Last Name</label>
            <input formControlName="last_name" class="pill-input" placeholder="Enter last name">
            <span class="error-text" *ngIf="profileForm.get('last_name')?.invalid && profileForm.get('last_name')?.touched">
              Last name is required.
            </span>
          </div>
        </div>
      </div>

      <div class="v-divider"></div>

      <div class="right-section">
        <div class="compact-row">
          <div class="field-group faculty-code">
            <label>Faculty Code</label>
            <input formControlName="code" class="pill-input" placeholder="e.g., 1234">
          </div>
          <div class="field-group program-id">
            <label>Program ID</label>
            <input formControlName="program_id" class="pill-input" placeholder="e.g., BSIT">
          </div>
        </div>

        <div class="compact-row">
          <div class="field-group birthdate">
            <label>Birthdate</label>
            <input type="date" formControlName="birthdate" class="pill-input">
          </div>
          <div class="field-group sex">
            <label>Sex</label>
            <select formControlName="sex" class="pill-input">
              <option [value]="''" disabled selected>Select option...</option> 
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>
        </div>
      </div>
    </div> 
    
    <h3 class="address-section-header">Address Details</h3>
    
    <div class="address-grid">
      <div class="field-group">
        <input formControlName="house_num" placeholder="House #" class="pill-input">
      </div>
      <div class="field-group">
        <input formControlName="street" placeholder="Street" class="pill-input">
      </div>
      <div class="field-group">
        <input formControlName="barangay" placeholder="Barangay" class="pill-input">
      </div>
      <div class="field-group">
        <input formControlName="city" placeholder="City" class="pill-input">
      </div>
      <div class="field-group">
        <input formControlName="province" placeholder="Province" class="pill-input">
      </div>
      <div class="field-group">
        <input formControlName="zipcode" placeholder="Zipcode" class="pill-input" maxlength="4">
        <span class="error-text" *ngIf="profileForm.get('zipcode')?.invalid && profileForm.get('zipcode')?.touched">
          Must be a 4-digit number.
        </span>
      </div>
    </div>

    <div class="action-row">
       <button type="button" class="btn-secondary-outline pop">Change Password</button>
       <button type="submit" 
               class="sienna-btn" 
               [disabled]="profileForm.invalid || isLoading"
               [class.force-disabled]="profileForm.invalid || isLoading">
        {{ isLoading ? 'Saving...' : 'Save Changes' }}
       </button>
    </div>
  </form>
</div>
