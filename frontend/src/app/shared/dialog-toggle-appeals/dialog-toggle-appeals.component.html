<div class="dialog-action-container" style="padding: 24px;">
  <h2 mat-dialog-title style="margin: 0 0 16px 0; color: #7d1f1f; font-weight: 600;">
    {{ data.currentState ? 'Disable Appeals Submission' : 'Enable Appeals Submission' }}
  </h2>

  <div mat-dialog-content>
    <div style="display: flex; flex-direction: column; gap: 16px;">
        <mat-form-field appearance="fill" style="width: 100%;">
            <mat-label>Start Date</mat-label>
            <input matInput 
                [matDatepicker]="startPicker" 
                [min]="minDate" 
                [(ngModel)]="startDate" 
                [disabled]="data.currentState"
                (dateChange)="onStartDateChange($event)" 
                readonly required 
                (click)="!data.currentState && startPicker.open()" />
            <mat-datepicker-toggle matIconSuffix [for]="startPicker" [disabled]="data.currentState"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="fill" style="width: 100%;">
            <mat-label>End Date</mat-label>
            <input matInput 
                [matDatepicker]="endPicker" 
                [min]="startDate || minDate" 
                [(ngModel)]="endDate" 
                [disabled]="data.currentState"
                readonly required 
                (click)="!data.currentState && endPicker.open()" />
            <mat-datepicker-toggle matIconSuffix [for]="endPicker" [disabled]="data.currentState"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
    </div>

    <div style="margin-top: 16px;">
      <mat-checkbox [(ngModel)]="sendEmail" color="primary">
        Send notification email to {{ data.type === 'all_appeals' ? 'all faculty members' : data.facultyName }}
      </mat-checkbox>
    </div>
  </div>

  <div mat-dialog-actions align="end" style="margin-top: 16px;">
    <button mat-button (click)="close()" style="color: #666;">Cancel</button>
    <button mat-flat-button color="primary" (click)="confirm()" 
            [disabled]="!data.currentState && (!startDate || !endDate)" 
            style="background-color: #7d1f1f; color: white;">
      Confirm
    </button>
  </div>
</div>
