<div class="dialog-pref-section-container">
  <h3 class="dialog-title">Select Section</h3>
  <div class="course-context">
    <span class="program-badge">{{ data.programCode }}</span>
    <span class="course-details">
      <strong>{{ data.courseCode }}</strong>: {{ data.courseTitle }}
    </span>
  </div>

  <span class="section-label">Available Sections</span>

  <mat-button-toggle-group [(ngModel)]="selectedSection">
    @for (section of data.sections; track section.section_id) {
      <mat-button-toggle [value]="section">
        {{ section.section_name }}  
      </mat-button-toggle>  
    }
  </mat-button-toggle-group>

  <div class="dialog-actions">
    <button mat-button (click)="cancel()">Cancel</button>
    <button mat-flat-button class="confirm-btn" (click)="confirm()" [disabled]="!selectedSection">Add</button>
  </div>
</div>
