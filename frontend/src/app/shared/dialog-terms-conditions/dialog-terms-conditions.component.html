<div
  class="dialog-terms-conditions-container"
  role="dialog"
  aria-labelledby="termsDialogTitle"
>
  <div class="accent-bar"></div>

  <div class="dialog-header">
    <div class="header-icon" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
        ></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </div>
    <div class="header-copy">
      <h2 id="termsDialogTitle" class="dialog-title">
        Terms and Conditions
      </h2>
    </div>
  </div>

  <div class="dialog-body">
    <p class="terms-description">
      By clicking <strong>“I Agree”</strong>, you consent to the collection,
      use, and processing of your personal data for legitimate purposes
      related to this service.
    </p>

    <p class="terms-description">
      Your information will be handled in accordance with our
      <a
        href="https://www.pup.edu.ph/privacy/"
        target="_blank"
        rel="noopener noreferrer"
        class="terms-link"
      >
        Privacy Policy
      </a>
      and in compliance with the <strong>Data Privacy Act of 2012</strong>.
    </p>

    <div class="checkbox-container">
      <input
        type="checkbox"
        id="agree"
        [(ngModel)]="isAccepted"
        cdkFocusInitial
      />
      <label for="agree" class="checkbox-label">
        I Agree and acknowledge the
        <a
          href="https://www.pup.edu.ph/terms/"
          target="_blank"
          rel="noopener noreferrer"
          class="terms-link"
        >
          Terms and Conditions
        </a>.
      </label>
    </div>
  </div>

  <div class="dialog-actions">
    <button
      type="button"
      class="cancel-btn"
      (click)="onCancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="confirm-btn"
      [disabled]="!isAccepted"
      (click)="onContinue()"
    >
      Continue
    </button>
  </div>
</div>
