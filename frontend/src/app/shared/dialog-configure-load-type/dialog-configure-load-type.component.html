<h2 mat-dialog-title class="dialog-title">CONFIGURE LOAD TYPES</h2>

<mat-dialog-content>
  <p class="dialog-subtitle">
    Add or remove load types. Deleting a type will automatically remove it from any existing faculty schedules.
  </p>

  <div class="add-container">
    <mat-form-field appearance="outline" class="add-field">
      <mat-label>New Load Type</mat-label>
      <input matInput [(ngModel)]="newTypeName" placeholder="e.g. Tutorial" (keyup.enter)="addType()" [disabled]="isSaving">
    </mat-form-field>

    <button mat-flat-button color="primary" class="add-button" (click)="addType()" [disabled]="!newTypeName.trim() || isSaving">
      <mat-icon>add</mat-icon> Add
    </button>
  </div>

  @if (isLoading) {
    <div class="loading-state">Loading...</div>
  } @else {
    <div class="load-types-table-wrapper">
      <table mat-table [dataSource]="dataSource" class="custom-table load-types-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Load Type Name </th>
          <td mat-cell *matCellDef="let element" class="load-type-name"> {{element.name}} </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="action-header"> Action </th>
          <td mat-cell *matCellDef="let element" class="action-cell">
            <button mat-icon-button class="delete-action-button" (click)="deleteType(element.id)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="load-types-table-header"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="load-types-table-row"></tr>
      </table>
    </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-footer">
  <button mat-flat-button color="primary" (click)="closeDialog()">Close</button>
</mat-dialog-actions>
