<h2 mat-dialog-title style="margin-bottom: 0;">Configure Load Types</h2>

<mat-dialog-content>
  <p style="color: #666; font-size: 0.9rem; margin-bottom: 20px;">
    Add or remove load types. Deleting a type will automatically remove it from any existing faculty schedules.
  </p>

  <div class="add-container" style="display: flex; gap: 10px; align-items: baseline;">
    <mat-form-field appearance="outline" style="flex-grow: 1;">
      <mat-label>New Load Type</mat-label>
      <input matInput [(ngModel)]="newTypeName" placeholder="e.g. Tutorial" (keyup.enter)="addType()" [disabled]="isSaving">
    </mat-form-field>
    
    <button mat-flat-button color="primary" (click)="addType()" [disabled]="!newTypeName.trim() || isSaving">
      <mat-icon>add</mat-icon> Add
    </button>
  </div>

  @if (isLoading) {
    <div style="padding: 20px; text-align: center; color: #666;">Loading...</div>
  } @else {
    <table mat-table [dataSource]="dataSource" class="custom-table" style="width: 100%; border: 1px solid #e0e0e0; border-radius: 4px;">
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Load Type Name </th>
        <td mat-cell *matCellDef="let element" style="font-weight: 500;"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef style="text-align: right; width: 80px;"> Action </th>
        <td mat-cell *matCellDef="let element" style="text-align: right;">
          <button mat-icon-button color="warn" (click)="deleteType(element.id)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" style="background-color: #f5f5f5;"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="closeDialog()">Close</button>
</mat-dialog-actions>
