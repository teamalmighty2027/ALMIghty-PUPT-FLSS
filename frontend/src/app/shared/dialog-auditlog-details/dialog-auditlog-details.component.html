<div class="audit-details-container" role="dialog" aria-labelledby="auditLogTitle">
  <div class="accent-bar"></div>

  <div class="dialog-header">
    <div class="avatar-shell" aria-hidden="true">
      <!-- Clipboard / History icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </div>
    <div class="header-copy">
      <h2 class="dialog-title" id="auditLogTitle">Audit Log Details</h2>
      <p class="dialog-subtitle">Review the full details of this log entry.</p>
    </div>
    <button
      class="close-btn"
      type="button"
      aria-label="Close dialog"
      (click)="close()"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="dialog-content">
    <section class="content-card primary-card">
      <h3 class="card-label">Current Log Data</h3>
      <div class="data-list">
        <div class="data-item">
          <span class="label">User:</span>
          <span class="value">{{ data.user }}</span>
        </div>
        <div class="data-item">
          <span class="label">Role:</span>
          <span class="value accent-text">{{ data.role }}</span>
        </div>
        <div class="data-item">
          <span class="label">Time:</span>
          <span class="value">{{ data.date_time }}</span>
        </div>
      </div>
    </section>

    <div class="mid-section">
      <section class="content-card compact">
        <h3 class="card-label">Action Type</h3>
        <div class="badge-wrapper">
          <span class="action-badge" [ngClass]="data.action_type.toLowerCase()">
            {{ data.action_type }}
          </span>
        </div>
      </section>

      <section class="content-card compact">
        <h3 class="card-label">System Metadata</h3>
        <div class="metadata-row">
          <span class="label">Log ID:</span>
          <span class="value">#{{ data.id }}</span>
        </div>
      </section>
    </div>

    <section class="content-card summary-card">
      <h3 class="card-label">Changes Summary</h3>
      <div class="summary-box">
        {{ data.changes_summary }}
      </div>
    </section>
  </div>
</div>
