<div class="reports-main" style="display: flex; flex-direction: column; height: 100%; position: relative;">

  <div class="reports-content" style="flex: 1 1 auto; overflow: hidden; height: 100%;">
    <router-outlet></router-outlet>
  </div>
  
  <mat-tab-group
    [(selectedIndex)]="selectedTabIndex"
    animationDuration="250ms"
    (selectedTabChange)="onTabChange($event)"
    class="reports-tab"
    headerPosition="below"
    style="flex-shrink: 0;">
    
    @for (tab of tabs; track tab) {
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="tab-label">
          <span mat-symbol="{{ tab.icon }}"></span>
          {{ tab.label }}
        </div>
      </ng-template>
    </mat-tab>
    }
  </mat-tab-group>

</div>
