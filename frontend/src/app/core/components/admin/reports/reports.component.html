<div class="reports-main" style="position: relative;">

  <div class="term-filter-container term-filter-positioned">
    <div class="term-filter-flex">
      <span class="term-filter-label">Academic Term:</span>
      
      <mat-form-field appearance="outline" class="term-filter-dropdown" subscriptSizing="dynamic">
        <mat-select [(ngModel)]="selectedTermId" (selectionChange)="onTermChange()">
          @for (term of availableTerms; track term.active_semester_id) {
            <mat-option [value]="term.active_semester_id">
              {{ term.year_start }}-{{ term.year_end }} ({{ getSemesterLabel(term.semester) }}){{ term.is_active === 1 ? ' - Active' : '' }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="reports-content">
    <router-outlet></router-outlet>
  </div>
  
  <mat-tab-group
    [(selectedIndex)]="selectedTabIndex"
    animationDuration="250ms"
    (selectedTabChange)="onTabChange($event)"
    class="reports-tab"
    headerPosition="below">
    @for (tab of tabs; track tab) {
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="tab-label">
          <span mat-symbol="{{ tab.icon }}"></span>
          {{ tab.label }}
        </div>
      </ng-template>
    </mat-tab>
    }
  </mat-tab-group>
</div>
