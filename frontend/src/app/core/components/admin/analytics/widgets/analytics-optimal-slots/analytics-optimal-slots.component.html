<div class="widget-container">
  <div *ngIf="isLoading" class="loading-overlay">
    <mat-spinner diameter="40"></mat-spinner>
    <span>Analyzing preferences...</span>
  </div>

  <div *ngIf="!isLoading && isEmpty" class="empty-state">
    <mat-icon>calendar_today</mat-icon>
    <p>No preference data available for this term.</p>
  </div>

  <div *ngIf="!isLoading && !isEmpty" class="content">
    <div class="recommendations">
      <h4>Top Opportunities</h4>
      <div class="rec-list">
        <div *ngFor="let rec of recommendations" class="rec-item">
          <div class="rec-icon">
            <mat-icon>star</mat-icon>
          </div>
          <div class="rec-info">
            <span class="rec-slot">{{ rec.day }} {{ rec.time }}</span>
            <span class="rec-desc">{{ rec.pref }} requests vs {{ rec.sched }} used</span>
          </div>
          <div class="rec-score">
            +{{ rec.score }}
          </div>
        </div>
      </div>
    </div>

    <div class="heatmap-container">
      <table class="heatmap-table">
        <thead>
          <tr>
            <th></th>
            <th *ngFor="let day of days">{{ day.substring(0, 3) }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let time of timeSlots">
            <td class="time-label">{{ time.substring(0, 5) }}</td>
            <td *ngFor="let day of days" 
                [style.background-color]="getScoreColor(gridData[day + '-' + time]?.score || 0)"
                [matTooltip]="(gridData[day + '-' + time]?.pref || 0) + ' Prefs / ' + (gridData[day + '-' + time]?.sched || 0) + ' Sched'"
                class="heat-cell">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
