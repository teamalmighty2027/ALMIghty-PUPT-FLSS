<div class="chart-container">
  <div class="loading-overlay" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Calculating program coverage...</p>
  </div>

  <div class="empty-state" *ngIf="!isLoading && isEmpty">
    <mat-icon fontSet="material-symbols-rounded">analytics</mat-icon>
    <p>No program data available</p>
    <span>Check if programs and sections are configured for this term</span>
  </div>

  <div class="chart-wrapper" *ngIf="!isLoading && !isEmpty">
    <canvas 
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>
</div>
