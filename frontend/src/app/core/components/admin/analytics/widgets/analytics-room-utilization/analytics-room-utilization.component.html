<div class="chart-container">
  <div class="loading-overlay" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Calculating room utilization...</p>
  </div>

  <div class="empty-state" *ngIf="!isLoading && isEmpty">
    <mat-icon fontSet="material-symbols-rounded">door_front</mat-icon>
    <p>No room utilization data for this term</p>
    <span>Rooms are either unassigned or have no active schedules</span>
  </div>

  <div class="chart-wrapper" *ngIf="!isLoading && !isEmpty">
    <canvas 
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>
</div>
