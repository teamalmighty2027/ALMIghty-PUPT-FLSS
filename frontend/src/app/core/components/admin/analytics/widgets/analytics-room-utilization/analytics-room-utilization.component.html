<div class="chart-container">
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="widget-loading-bar">
      <span class="widget-loading-label">Calculating room utilization...</span>
      <div class="widget-progress-track">
        <div class="widget-progress-bar"></div>
        <div class="widget-progress-bar secondary"></div>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="!isLoading && isEmpty">
    <mat-icon fontSet="material-symbols-rounded">door_front</mat-icon>
    <p>No room utilization data for this term</p>
    <span>Rooms are either unassigned or have no active schedules</span>
  </div>

  <div class="chart-wrapper" *ngIf="!isLoading && !isEmpty">
    <canvas 
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>

  <app-analytics-insight [text]="insightText" [type]="insightType"></app-analytics-insight>
</div>
