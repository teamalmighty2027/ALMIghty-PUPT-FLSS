<div class="chart-container">
  <div class="loading-overlay" *ngIf="isLoading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Analyzing faculty loads...</p>
  </div>

  <div class="empty-state" *ngIf="!isLoading && isEmpty">
    <mat-icon fontSet="material-symbols-rounded">person_off</mat-icon>
    <p>No faculty load data found</p>
    <span>Check if faculty have been assigned to courses this term</span>
  </div>

  <div class="chart-wrapper" *ngIf="!isLoading && !isEmpty">
    <canvas 
      baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>
</div>
