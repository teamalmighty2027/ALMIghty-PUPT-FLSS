<div class="widget-container">
  <div class="search-header" *ngIf="hasData">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Search Faculty</mat-label>
      <input matInput [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()"
             placeholder="Enter name...">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>
  </div>

  <div *ngIf="isLoading" class="loading-overlay">
    <div class="widget-loading-bar">
      <span class="widget-loading-label">Analyzing faculty load deviations...</span>
      <div class="widget-progress-track">
        <div class="widget-progress-bar"></div>
        <div class="widget-progress-bar secondary"></div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && isEmpty" class="empty-state">
    <ng-container *ngIf="searchTerm.trim(); else defaultEmpty">
      <mat-icon>search_off</mat-icon>
      <p>No matching faculty found.</p>
    </ng-container>
    <ng-template #defaultEmpty>
      <mat-icon>check_circle</mat-icon>
      <p>All faculty are optimally loaded.</p>
    </ng-template>
  </div>

  <div *ngIf="!isLoading && !isEmpty" class="chart-wrapper" [style.height.px]="chartHeight">
    <canvas baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType">
    </canvas>
  </div>

  <app-analytics-insight [text]="insightText" [type]="insightType"></app-analytics-insight>
</div>
