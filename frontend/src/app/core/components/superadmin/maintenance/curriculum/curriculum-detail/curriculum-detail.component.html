<div class="curriculum-detail-container">
  @if (isLoading) {
  <div class="loading-wrapper">
    <app-loading></app-loading>
  </div>
  } @else {
  <div class="curriculum-header-container" [@fadeAnimation]>
    <app-table-header
      [inputFields]="headerInputFields"
      [addButtonLabel]="'Manage Programs'"
      [addIconName]="'apps'"
      [showExportDialog]="true"
      [customExportOptions]="customExportOptions"
      [isLoading]="isManagingPrograms"
      (inputChange)="onInputChange($event)"
      (export)="onExport($event)"
      (add)="onManagePrograms()"
      [selectedValues]="{ courseSearch: searchQuery, program: selectedProgram, yearLevel: selectedYear, semester: selectedSemester }"
    ></app-table-header>
  </div>

  <div class="curriculum-semesters-container">
    <div class="scrollable-content">
      
      @if (renderGroups.length === 0) {
        <div style="text-align: center; padding: 3rem; color: #666; font-size: 16px; font-weight: 500;">
           No courses found matching the selected filters.
        </div>
      } @else {
        @for (group of renderGroups; track group.id; let i = $index) {
        <div class="semester-container" [@pageFloatUpAnimation]>
          <app-table-generic
            [columns]="columns"
            [data]="group.courses"
            [tableName]="'course/s'"
            [displayedColumns]="displayedColumns"
            [showTableHeading]="true"
            [tableHeadingTitle]="group.heading"
            [tableHeadingButtonText]="'Add Course'"
            [tableHeadingButtonIcon]="'add'"
            (tableHeadingButtonClick)="onAddCourse(group)"
            (edit)="onEditCourse($event, group)"
            (delete)="onDeleteCourse($event, group)"
          ></app-table-generic>
        </div>
        }
      }

    </div>
  </div>
  }
</div>
