<div class="system-notices-container">
  
  <!-- Filters Bar -->
  <div class="filters-bar">
    <div class="filter-group">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="selectedResolved" (selectionChange)="onFilterChange()" aria-label="Filter by resolved status">
          <mat-option value="false">Open</mat-option>
          <mat-option value="true">Resolved</mat-option>
          <mat-option value="">All</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Severity</mat-label>
        <mat-select [(ngModel)]="selectedSeverity" (selectionChange)="onFilterChange()" aria-label="Filter by severity">
          <mat-option value="">All Severities</mat-option>
          <mat-option value="info">Info</mat-option>
          <mat-option value="warning">Warning</mat-option>
          <mat-option value="error">Error</mat-option>
          <mat-option value="critical">Critical</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Notice Type</mat-label>
        <mat-select [(ngModel)]="selectedType" (selectionChange)="onFilterChange()" aria-label="Filter by type">
          <mat-option value="">All Types</mat-option>
          <mat-option value="reactivation_request">Reactivation Request</mat-option>
          <mat-option value="audit_event">Audit Event</mat-option>
          <mat-option value="backend_exception">Backend Exception</mat-option>
          <mat-option value="frontend_error">Frontend Error</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  @if (isLoading) {
    <div class="loading-wrapper">
      <app-loading></app-loading>
    </div>
  } @else {
    <div class="system-notices-table-container" [@fadeAnimation]>
      
      <!-- Severity Badge Template -->
      <ng-template #severityBadgeTemplate let-element>
        <span class="severity-badge" [ngClass]="element.severity.toLowerCase()">
          {{ element.severity | uppercase }}
        </span>
      </ng-template>

      <!-- Status Template -->
      <ng-template #statusTemplate let-element>
        @if (element.resolved_at) {
          <span class="status-badge resolved" matTooltip="Resolved at {{ formatDateTime(element.resolved_at) }}">
            Resolved
          </span>
        } @else {
          <span class="status-badge open">
            Open
          </span>
        }
      </ng-template>

      <app-table-generic
        [data]="(notices$ | async) || []"
        [columns]="columns"
        [displayedColumns]="displayedColumns"
        [showViewButton]="true"
        [showEditButton]="false"  
        [showDeleteButton]="false"
        [totalItems]="totalNotices"
        [pageSize]="pageSize"
        [pageIndex]="currentPage - 1" 
        [isServerSidePagination]="true" 
        (pageChange)="onPageChange($event)"
        (view)="onViewDetails($event)"> 
      </app-table-generic>
      
    </div>
  }
</div>
